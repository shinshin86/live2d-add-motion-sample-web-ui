<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D モーション追加サンプル - Hiyori</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
    body { display: flex; background: #2b2d3a; color: #e8e8ee; overflow: hidden; }
    #stage { flex: 1; min-width: 0; position: relative; }
    #stage canvas { display: block; }
    #panel {
      width: 300px; flex-shrink: 0; padding: 16px; overflow-y: auto;
      background: #1f2130; border-left: 1px solid #3a3d52;
      display: flex; flex-direction: column; gap: 14px;
    }
    #panel h1 { font-size: 15px; }
    #panel .sub { font-size: 11px; color: #9aa0b5; margin-top: 3px; }

    /* Newly added motions (always expanded, highlighted) */
    #newActions {
      background: linear-gradient(160deg, #2c3052, #262a41);
      border: 1px solid #6f79c9; border-radius: 12px; padding: 12px;
    }
    #newActions .card-title {
      font-size: 12px; font-weight: 600; color: #aeb6f5; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    #newActions .badge {
      font-size: 10px; font-weight: 600; color: #1f2130;
      background: #9aa4f0; border-radius: 99px; padding: 2px 8px;
    }
    #newActions .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button.motion {
      padding: 9px 10px; font-size: 13px; text-align: left; color: #e8e8ee;
      background: #33364a; border: 1px solid #474b66; border-radius: 8px;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      width: 100%;
    }
    button.motion:hover { background: #424766; }
    button.motion:active { background: #565c85; }
    button.motion.new { background: #3a3f63; border-color: #6f79c9; }
    button.motion.new:hover { background: #474d7a; }
    button.motion.new::before { content: "★ "; color: #ffd479; }
    button.motion .file { display: block; font-size: 10px; color: #8f95ac; margin-top: 2px; }

    /* Pre-existing motions (collapsible) */
    #buttons { display: grid; gap: 8px; }
    details.group {
      background: #262838; border: 1px solid #3a3d52; border-radius: 10px;
      overflow: hidden;
    }
    details.group summary {
      list-style: none; cursor: pointer; padding: 9px 12px;
      font-size: 12px; color: #b6bccf; display: flex; align-items: center; gap: 8px;
      user-select: none;
    }
    details.group summary::-webkit-details-marker { display: none; }
    details.group summary::before {
      content: "▸"; color: #6f79c9; transition: transform 0.15s; font-size: 11px;
    }
    details.group[open] summary::before { transform: rotate(90deg); }
    details.group summary .count {
      margin-left: auto; font-size: 10px; color: #8f95ac;
      background: #33364a; border-radius: 99px; padding: 1px 7px;
    }
    details.group .body { padding: 2px 10px 10px; display: grid; gap: 6px; }

    /* View controls */
    #viewControls {
      border-top: 1px solid #3a3d52; padding-top: 12px;
      display: grid; gap: 8px;
    }
    #viewControls .hint { font-size: 11px; color: #9aa0b5; line-height: 1.7; }
    #viewControls .hint b { color: #cfd3e6; font-weight: 600; }
    #resetView {
      padding: 8px 12px; font-size: 12px; color: #cfd3e6;
      background: transparent; border: 1px dashed #565c85; border-radius: 8px;
      cursor: pointer;
    }
    #resetView:hover { background: #2c2f44; }
    /* One-shot / loop sections inside the new-motion card */
    #newActions .section + .section { margin-top: 12px; padding-top: 10px; border-top: 1px solid #4a5080; }
    #newActions .section-title { font-size: 11px; color: #cfd3e6; margin-bottom: 2px; }
    #newActions .section-hint { font-size: 10px; color: #8f95ac; margin-bottom: 8px; }
    /* The motion currently playing */
    button.motion.playing { background: #50578f; border-color: #ffd479; box-shadow: 0 0 0 1px #ffd479 inset; }
    button.motion .state { display: none; font-size: 10px; color: #ffd479; margin-top: 3px; }
    button.motion.playing .state { display: block; }
    button.motion.looping { border-color: #7fd6b0; box-shadow: 0 0 0 1px #7fd6b0 inset; animation: pulse 1.6s ease-in-out infinite; }
    button.motion.looping .state { color: #7fd6b0; }
    @keyframes pulse { 50% { background: #3a6b5c; } }
    #loopControls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    #loopControls button {
      padding: 7px 8px; font-size: 11px; color: #cfd3e6; border-radius: 8px;
      background: #2c2f44; border: 1px solid #565c85; cursor: pointer;
    }
    #loopControls button:hover:not(:disabled) { background: #3a3f63; }
    #loopControls button:disabled { opacity: 0.35; cursor: default; }
    #stopLoop:not(:disabled) { color: #1f2130; background: #ff9f8f; border-color: #ff9f8f; font-weight: 600; }
    #stopLoop:not(:disabled):hover { background: #ffb6a9; }
    #lipsyncToggle[aria-pressed="true"] { color: #1f2130; background: #7fd6b0; border-color: #7fd6b0; font-weight: 600; }
    #status {
      position: absolute; left: 12px; bottom: 12px; padding: 6px 12px;
      font-size: 12px; color: #cfd3e6; background: rgba(20, 21, 32, 0.75);
      border-radius: 6px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"><div id="status">読み込み中…</div></div>
  <div id="panel">
    <div>
      <h1>Live2D モーション再生</h1>
      <p class="sub">ボタンでモーションを手動再生できます</p>
    </div>
    <div id="newActions">
      <div class="card-title">今回追加したモーション <span class="badge">Action</span></div>
      <div class="section">
        <div class="section-title">単発アクション</div>
        <div class="section-hint">1回再生して元の姿勢に戻ります</div>
        <div class="grid" id="newButtons"></div>
      </div>
      <div class="section" id="loopSection" hidden>
        <div class="section-title">ループ(話しながら再生)</div>
        <div class="section-hint">「ループ停止」を押すか、別のモーションを再生するまで繰り返します</div>
        <div class="grid" id="loopButtons"></div>
        <div id="loopControls">
          <button id="stopLoop" disabled>■ ループ停止</button>
          <button id="lipsyncToggle" aria-pressed="false">疑似リップシンク: OFF</button>
        </div>
      </div>
    </div>
    <div id="buttons"></div>
    <div id="viewControls">
      <div class="hint">
        <b>ドラッグ</b>: アバターを移動 /
        <b>ホイール・ピンチ</b>: カーソル位置を中心に拡大縮小
      </div>
      <button id="resetView">表示リセット(位置・サイズ)</button>
    </div>
  </div>

  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
  <script>
    const status = document.getElementById("status");

    // Headless verification (tools/verify_browser.sh): Chrome takes its
    // screenshot when "load" fires, so &hold=N keeps "load" pending with a
    // request that only the verify server answers after N seconds (any other
    // server answers 404 at once, so this is harmless outside verification).
    const hold = Number(new URLSearchParams(location.search).get("hold"));
    if (hold > 0) {
      const img = document.createElement("img");
      img.hidden = true;
      img.src = `__verify_hold?s=${hold}`;
      document.body.appendChild(img);
    }

    // The model is resolved from model.config.json (generated by tools/setup_model.py).
    // It can be overridden with ?model=<path to model3.json>.
    async function resolveModelJson() {
      const override = new URLSearchParams(location.search).get("model");
      if (override) return override;
      const res = await fetch("model.config.json").catch(() => null);
      if (res && res.ok) {
        const cfg = await res.json();
        if (cfg.name) {
          document.title = `Live2D モーション追加サンプル - ${cfg.name}`;
          document.querySelector("#panel h1").textContent = `${cfg.name} モーション再生`;
        }
        return cfg.model3;
      }
      throw new Error("model.config.json がありません。python3 tools/setup_model.py を実行してください");
    }

    async function main() {
      const MODEL_JSON = await resolveModelJson();
      const stage = document.getElementById("stage");
      const app = new PIXI.Application({
        backgroundAlpha: 0,
        preserveDrawingBuffer: true,
        resizeTo: stage,
        autoDensity: true,
        resolution: window.devicePixelRatio || 1,
      });
      stage.appendChild(app.view);

      const model = await PIXI.live2d.Live2DModel.from(MODEL_JSON);
      app.stage.addChild(model);

      let userAdjusted = false; // after drag/zoom, don't reset the layout on resize
      function layout() {
        const scale = Math.min(
          app.screen.width / model.internalModel.width,
          app.screen.height / model.internalModel.height
        ) * 1.1;
        model.scale.set(scale);
        model.anchor.set(0.5, 0.5);
        model.position.set(app.screen.width / 2, app.screen.height / 2 + app.screen.height * 0.05);
      }
      layout();
      app.renderer.on("resize", () => { if (!userAdjusted) layout(); });

      // Move by dragging
      model.interactive = true;
      model.buttonMode = true;
      let drag = null;
      model.on("pointerdown", (e) => {
        drag = {
          dx: e.data.global.x - model.x,
          dy: e.data.global.y - model.y,
        };
      });
      model.on("pointermove", (e) => {
        if (!drag) return;
        userAdjusted = true;
        model.position.set(e.data.global.x - drag.dx, e.data.global.y - drag.dy);
      });
      model.on("pointerup", () => { drag = null; });
      model.on("pointerupoutside", () => { drag = null; });

      // Zoom with wheel/pinch, centered on the cursor
      const MIN_SCALE = 0.05, MAX_SCALE = 5;
      app.view.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = app.view.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const base = model.scale.x;
        const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, base * Math.exp(-e.deltaY * 0.002)));
        const factor = next / base;
        if (factor === 1) return;
        userAdjusted = true;
        model.scale.set(next);
        model.position.set(mx + (model.x - mx) * factor, my + (model.y - my) * factor);
      }, { passive: false });

      document.getElementById("resetView").onclick = () => {
        userAdjusted = false;
        layout();
      };

      const settings = model.internalModel.settings;
      const groups = settings.motions; // FileReferences.Motions
      const NEW_GROUP = "Action"; // group of motions added by this repo (JSON only)
      const mm = model.internalModel.motionManager;

      // ---- Loop playback (reference implementation for apps; no library changes).
      // The Cubism Framework does not read Meta.Loop, so the player enables
      // looping on the motion instance itself, before it starts:
      //   setIsLoop(true)        wrap time back to 0 at Duration (never finishes)
      //   setIsLoopFadeIn(false) no fade-in restart per cycle (it would stall
      //                          the motion at every seam)
      // Only the Action group (generated here) is looped: Editor-exported
      // motions often carry Meta.Loop=true without actually being seamless.
      const metaLoop = {};
      async function isLoopMotion(group, index) {
        const key = `${group}:${index}`;
        if (!(key in metaLoop)) {
          const entry = groups[group][index];
          const res = await fetch(settings.resolveURL(entry.File));
          metaLoop[key] = group === NEW_GROUP && !!(await res.json()).Meta.Loop;
        }
        return metaLoop[key];
      }
      async function prepareMotion(group, index) {
        const loop = await isLoopMotion(group, index);
        const motion = await mm.loadMotion(group, index); // cached instance pixi will play
        if (motion) {
          motion.setIsLoop(loop);
          motion.setIsLoopFadeIn(false);
        }
        return { motion, loop };
      }
      let current = null; // the running loop: { motion, label, duration, startedAt }
      let frozen = false; // set by the &freeze= debug hook
      const stopLoop = document.getElementById("stopLoop");
      const buttons = {}; // "group:index" -> motion button

      // Show which motion is playing; the stop button only works during a loop
      function showPlaying(key, loop) {
        for (const [k, btn] of Object.entries(buttons)) {
          btn.classList.toggle("playing", k === key);
          btn.classList.toggle("looping", k === key && loop);
          btn.querySelector(".state").textContent = loop ? "⟳ ループ中" : "▶ 再生中";
        }
        stopLoop.disabled = !(key && loop);
      }
      async function playMotion(group, index, label) {
        const { motion, loop } = await prepareMotion(group, index);
        const ok = await model.motion(group, index, PIXI.live2d.MotionPriority.FORCE);
        current = ok && loop
          ? { motion, label, duration: motion.getLoopDuration(), startedAt: performance.now() }
          : null;
        showPlaying(ok ? `${group}:${index}` : null, loop);
        return { ok, loop };
      }
      // Stop now: the idle fades in from the current pose
      stopLoop.onclick = () => {
        current = null;
        mm.stopAllMotions();
        showPlaying(null, false);
        status.textContent = "ループを停止しました";
      };
      // Stop at the end of the running cycle instead
      function finishAfterThisCycle() {
        if (current) current.motion.setIsLoop(false);
      }
      app.ticker.add(() => {
        if (!current || frozen) return;
        const cycle = Math.floor((performance.now() - current.startedAt) / 1000 / current.duration) + 1;
        const text = `ループ再生中: ${current.label} (${cycle}周目)`;
        if (status.textContent !== text) status.textContent = text;
      });

      // ---- Simulated lip sync: overwrite the LipSync parameters every frame after
      // the motion update, which is where a real player writes its audio level
      const lipsyncIds = (model.internalModel.settings.groups || [])
        .find((g) => g.Name === "LipSync")?.Ids || [];
      const lipsyncToggle = document.getElementById("lipsyncToggle");
      let lipsyncOn = false;
      function setLipsync(on) {
        lipsyncOn = on;
        lipsyncToggle.setAttribute("aria-pressed", String(on));
        lipsyncToggle.textContent = `疑似リップシンク: ${on ? "ON" : "OFF"}`;
      }
      lipsyncToggle.onclick = () => setLipsync(!lipsyncOn);
      model.internalModel.on("beforeModelUpdate", () => {
        if (!lipsyncOn) return;
        const t = performance.now() / 1000;
        const v = Math.max(0, Math.sin(t * 11) * 0.6 + Math.sin(t * 4.3) * 0.4);
        for (const id of lipsyncIds) model.internalModel.coreModel.setParameterValueById(id, v);
      });

      function motionButton(group, entry, index) {
        const btn = document.createElement("button");
        btn.className = "motion" + (group === NEW_GROUP ? " new" : "");
        const file = entry.File.split("/").pop().replace(".motion3.json", "");
        const label = entry.Name || file;
        btn.innerHTML = "";
        btn.append(label);
        const small = document.createElement("span");
        small.className = "file";
        small.textContent = file;
        btn.appendChild(small);
        const state = document.createElement("span");
        state.className = "state";
        btn.appendChild(state);
        buttons[`${group}:${index}`] = btn;
        btn.onclick = async () => {
          status.textContent = `再生中: ${label}`;
          const { ok } = await playMotion(group, index, label);
          if (!ok) status.textContent = `再生失敗: ${group}[${index}]`;
        };
        return btn;
      }

      // Newly added motions: always expanded in the top card, one-shots and loops apart
      const newButtons = document.getElementById("newButtons");
      const loopButtons = document.getElementById("loopButtons");
      const newEntries = groups[NEW_GROUP] || [];
      const newLoops = await Promise.all(newEntries.map((_, i) => isLoopMotion(NEW_GROUP, i)));
      newEntries.forEach((entry, index) => {
        const btn = motionButton(NEW_GROUP, entry, index);
        (newLoops[index] ? loopButtons : newButtons).appendChild(btn);
      });
      document.getElementById("loopSection").hidden = !newLoops.some(Boolean);

      // Pre-existing motions: one collapsible section per group (closed by default)
      const container = document.getElementById("buttons");
      for (const [group, entries] of Object.entries(groups)) {
        if (group === NEW_GROUP) continue;
        const details = document.createElement("details");
        details.className = "group";
        const summary = document.createElement("summary");
        summary.append(`既存: ${group}`);
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = entries.length;
        summary.appendChild(count);
        details.appendChild(summary);
        const body = document.createElement("div");
        body.className = "body";
        entries.forEach((entry, index) => {
          body.appendChild(motionButton(group, entry, index));
        });
        details.appendChild(body);
        container.appendChild(details);
      }

      model.internalModel.motionManager.on("motionFinish", () => {
        current = null;
        showPlaying(null, false);
        status.textContent = "アイドル中(Idleグループ自動再生)";
      });
      status.textContent = "準備完了 — ボタンを押してください";

      // Debug hooks: ?play=Group:index auto-plays a motion, &freeze=seconds pins the pose at that time,
      // &cycles=N ends a loop motion after its Nth cycle, &lipsync=1 turns on the simulated lip sync
      const params = new URLSearchParams(location.search);
      if (params.get("lipsync")) setLipsync(true);

      // ?uitest=1 runs a synthetic drag/zoom event test (for verification)
      if (params.get("uitest")) {
        setTimeout(() => {
          const before = { x: model.x, y: model.y, s: model.scale.x };
          const rect = app.view.getBoundingClientRect();
          const cx = rect.left + before.x, cy = rect.top + before.y;
          const ev = (type, x, y) => new PointerEvent(type, {
            clientX: x, clientY: y, pointerId: 1, pointerType: "mouse",
            isPrimary: true, buttons: 1, bubbles: true,
          });
          app.view.dispatchEvent(ev("pointerdown", cx, cy));
          document.dispatchEvent(ev("pointermove", cx + 120, cy + 60));
          document.dispatchEvent(ev("pointerup", cx + 120, cy + 60));
          const afterDrag = { x: model.x, y: model.y };
          app.view.dispatchEvent(new WheelEvent("wheel", {
            clientX: cx, clientY: cy, deltaY: -300, bubbles: true, cancelable: true,
          }));
          status.textContent =
            `uitest drag:(${before.x.toFixed(0)},${before.y.toFixed(0)})->` +
            `(${afterDrag.x.toFixed(0)},${afterDrag.y.toFixed(0)}) ` +
            `zoom:${before.s.toFixed(3)}->${model.scale.x.toFixed(3)}`;
        }, 300);
      }
      const play = params.get("play");
      if (play) {
        const [g, i] = play.split(":");
        const { ok: started, loop } = await playMotion(g, Number(i || 0), play);
        const startedAt = performance.now();
        status.textContent = `自動再生: ${play} started=${started}`;
        const cycles = Number(params.get("cycles"));
        if (loop && cycles > 0) {
          // flip the flag mid-cycle so the motion ends exactly at the Nth seam
          setTimeout(finishAfterThisCycle, (cycles - 0.5) * current.duration * 1000);
        }
        const freeze = Number(params.get("freeze"));
        if (freeze > 0) setTimeout(() => {
          // Keep rendering but stop motion updates, pinning the pose at this moment
          frozen = true;
          const elapsed = (performance.now() - startedAt) / 1000;
          status.textContent = `自動再生: ${play} started=${started}` +
            (loop ? ` loop` : "") + ` frozen@${elapsed.toFixed(2)}s playing=${mm.playing}`;
          mm.update = () => true;
        }, freeze * 1000);
      }
    }

    main().catch((e) => {
      status.textContent = "エラー: " + e.message;
      console.error(e);
    });
  </script>
</body>
</html>
